name: Build Canvas Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to build and push (the canvas-lms release tag this branch is pinned to)"
        required: true
        default: "2026-05-20.143"
      platform:
        description: "Target platform. tutorify-preprod-eks runs Graviton (t4g/m6g), so arm64 is the deployable one."
        required: true
        default: "linux/arm64"
        type: choice
        options:
          - linux/arm64
          - linux/amd64

env:
  ECR_REGISTRY: 985384755045.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: tutorify/canvas-lms
  AWS_REGION: us-east-1

jobs:
  build:
    name: Build & push
    # NOTE: GitHub "larger runners" are NOT available on this org's plan tier (confirmed via
    # the API on 2026-08-02), so this label does not resolve and the workflow cannot currently
    # be dispatched. A self-hosted fleet exists in the internal account (labels: self-hosted,
    # linux, x64, tutorify-internal) but is amd64-only and its PAT/webhook wiring is unfinished.
    # Building arm64 there would need QEMU emulation, which is very slow for Canvas. Resolve
    # before dispatching: either add an arm64 architecture to the runner module's nodepool, or
    # accept the emulated build. Until then, builds are done locally (see docs).
    runs-on: ubuntu-latest-8-cores
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::985384755045:role/TutorifyGithubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Only does anything when the runner arch differs from inputs.platform; a no-op otherwise.
      - name: Set up QEMU (cross-build support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Build to an ARCH-SUFFIXED tag, never the bare release tag. The release tag is an OCI
      # image index assembled in the next step, so a build for one architecture can never
      # overwrite another architecture's image under the same tag.
      - name: Build and push (arch-suffixed tag)
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          ARCH="${PLATFORM#linux/}"
          docker buildx build \
            --platform "$PLATFORM" \
            -f Dockerfile.production \
            --build-arg RUBY=3.4 \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${IMAGE_TAG}" \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}-${ARCH}" \
            --push \
            .

      # Rebuild the release-tag index from every arch-suffixed tag that exists, so adding a
      # second architecture later extends the index instead of replacing it.
      - name: Assemble multi-arch index under the release tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          SRC=()
          for a in arm64 amd64; do
            REF="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}-${a}"
            if docker manifest inspect "$REF" >/dev/null 2>&1; then
              echo "including $REF"
              SRC+=("$REF")
            fi
          done
          docker buildx imagetools create --tag "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" "${SRC[@]}"

      - name: Summary
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          PLATFORMS=$(docker buildx imagetools inspect "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" \
            --format '{{range .Manifest.Manifests}}{{if ne .Platform.Architecture "unknown"}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}{{end}}')
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Canvas image build

          | Field | Value |
          |-------|-------|
          | **Tag** | \`${IMAGE_TAG}\` |
          | **Built platform** | \`${PLATFORM}\` |
          | **Index now contains** | \`${PLATFORMS}\` |
          | **Image** | \`${ECR_REGISTRY}/${ECR_REPOSITORY}\` |
          | **Commit** | \`${GITHUB_SHA::7}\` |
          EOF
